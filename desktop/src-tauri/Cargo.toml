[package]
name = "mediaindex"
version = "0.1.0"
description = "Local-first media indexing desktop application"
authors = ["Lanque"]
edition = "2021"

[lib]
name = "mediaindex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
