name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API dependencies
        run: python -m pip install --disable-pip-version-check -r api/requirements-dev.txt

      - name: Check whitespace errors
        shell: bash
        run: |
          if [ -n "${GITHUB_BASE_REF}" ]; then
            git diff --check "origin/${GITHUB_BASE_REF}...HEAD"
          else
            git diff --check HEAD^
          fi

      - name: Validate repository documentation
        run: python scripts/check_repository.py

      - name: Run repository tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Validate PostgreSQL migrations
        run: python scripts/check_migrations.py

      - name: Validate infrastructure scaffold
        run: python scripts/check_infra.py

  desktop:
    name: Desktop checks
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build TypeScript frontend
        working-directory: desktop
        run: npm run build

      - name: Check Rust formatting
        working-directory: desktop
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Run Rust tests
        working-directory: desktop
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Set up FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare bundled FFmpeg binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop/src-tauri/bin
          Copy-Item (Get-Command ffmpeg).Source desktop/src-tauri/bin/ffmpeg.exe
          Copy-Item (Get-Command ffprobe).Source desktop/src-tauri/bin/ffprobe.exe

      - name: Build Windows installer
        working-directory: desktop
        run: npm run tauri build

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: mediaindex-windows-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
