name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check whitespace errors
        shell: bash
        run: |
          if [ -n "${GITHUB_BASE_REF}" ]; then
            git diff --check "origin/${GITHUB_BASE_REF}...HEAD"
          else
            git diff --check HEAD^
          fi

      - name: Validate repository documentation
        run: python scripts/check_repository.py

      - name: Run repository tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Validate PostgreSQL migrations
        run: python scripts/check_migrations.py

      - name: Validate infrastructure scaffold
        run: python scripts/check_infra.py

  desktop:
    name: Desktop checks
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build TypeScript frontend
        working-directory: desktop
        run: npm run build

      - name: Check Rust formatting
        working-directory: desktop
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Run Rust tests
        working-directory: desktop
        run: cargo test --manifest-path src-tauri/Cargo.toml
